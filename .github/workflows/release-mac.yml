name: Build macOS

# Chạy khi đẩy tag phiên bản (ví dụ v0.1.7) hoặc bấm tay trong tab Actions.
# Tag phải trùng "version" trong package.json để bản Mac và bản Windows cùng một Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Nhúng API key (tuỳ chọn, giống ai-key.txt ở bản Windows)
        env:
          AI_KEY: ${{ secrets.AI_KEY }}
        run: |
          if [ -n "$AI_KEY" ]; then printf '%s' "$AI_KEY" > ai-key.txt; fi
      - run: npx vite build
      - run: npm run build:electron
      - name: Đóng gói bản Mac
        run: npx electron-builder --mac --x64 --arm64 --publish never
      - name: Đưa file Mac lên GitHub Release của phiên bản này
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "NQS Chart Builder $VER"
          fi
          gh release upload "$TAG" out/*.dmg out/*.zip out/*.blockmap out/latest-mac.yml --clobber
